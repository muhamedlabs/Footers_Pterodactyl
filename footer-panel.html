<div class="footer-wrapper" data-bg="off" data-protect="footer">

                <a href="https://github.com/muhamedlabs" target="_blank" class="social-icon"

                    <i class="fa-brands fa-github" aria-hidden="true"></i>
                </a>
                <span class="multilink-wrap">
                    <a href="https://link.muhamedlabs.pro" target="_blank" class="multilink-button"
                        aria-label="Перейти на страницу с мультиссылкой">
                        <span id="button-text">Мультиссылка</span>
                        <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24">

</div>

<script>
    (function () {
        var BASE = "https://cdn.jsdelivr.net/gh/muhamedlabs/Footers_Pterodactyl@complete/";
        var CSS = ["base", "layout", "brand", "actions", "status", "effects", "protect", "a11y", "responsive"];
        var JS = ["language", "typewriter", "particles", "protection", "background", "main"];

        CSS.forEach(function (n) {
            var l = document.createElement("link");
            l.rel = "stylesheet";
            l.href = BASE + "assets/css/" + n + ".css";
            document.head.appendChild(l);
        });

        var logo = document.querySelector("#footer .brand-mk img");
        if (logo) logo.src = BASE + "assets/icons/icon-m-pink.webp";

        JS.forEach(function (n) {
            var s = document.createElement("script");
            s.src = BASE + "assets/js/" + n + ".js";
            s.async = false;
            document.body.appendChild(s);
        });
    })();
    </script>
