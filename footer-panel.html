    <!-- ===== ПОДКЛЮЧЕНИЕ С GITHUB (jsDelivr) =====
         Адрес репозитория задаётся одной строкой FT_BASE.
         Репозиторий: github.com/muhamedlabs/Footers_Pterodactyl (ветка main)
         В репозитории должна лежать папка assets/ (css, js, fonts, icons, images).
         Стили, шрифт, картинки и скрипт подтянутся сами. -->
    <script>
    (function () {
        var FT_BASE = "https://cdn.jsdelivr.net/gh/muhamedlabs/Footers_Pterodactyl@main/"; // ← ветка (main) или тег релиза

        var head = document.head;
        var css = document.createElement("link");
        css.rel = "stylesheet";
        css.href = FT_BASE + "assets/css/styles.css";
        head.appendChild(css);

        var font = document.createElement("link");
        font.rel = "preload"; font.as = "font"; font.type = "font/ttf"; font.crossOrigin = "anonymous";
        font.href = FT_BASE + "assets/fonts/kharkiv_tone.ttf";
        head.appendChild(font);

        var logo = document.querySelector("#footer .brand-mk img");
        if (logo) logo.src = FT_BASE + "assets/icons/icon-m-pink.webp";

        var js = document.createElement("script");
        js.src = FT_BASE + "assets/js/script.js";
        document.body.appendChild(js);
    })();
    </script>
